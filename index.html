<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>叙己 · 记忆花园</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fdf9f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: system-ui, sans-serif;
  }
  .phone-frame {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9 / 19.5;
    border: 2px solid #c3c8c0;
    border-radius: 2.5rem;
    overflow: hidden;
    box-shadow:
      0 0 0 6px #fdf9f0,
      0 20px 60px rgba(78, 100, 81, 0.08),
      0 4px 16px rgba(78, 100, 81, 0.04);
    background: #fdf9f0;
  }
  .phone-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 2.2rem;
    display: block;
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <iframe src="html.final.html" title="叙己记忆花园"></iframe>
  </div>
</body>
</html>
